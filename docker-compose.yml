services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      MODEL_PATH: /app/models/best.pt
      CONFIDENCE_THRESHOLD: ${CONFIDENCE_THRESHOLD:-0.43}
      BOLT_CONFIDENCE_THRESHOLD: ${BOLT_CONFIDENCE_THRESHOLD:-0.43}
      NUT_CONFIDENCE_THRESHOLD: ${NUT_CONFIDENCE_THRESHOLD:-0.56}
      ENABLE_CROP_CLASSIFIER: ${ENABLE_CROP_CLASSIFIER:-true}
      CLASSIFIER_MODEL_PATH: /app/models/classifier_best.pt
      CLASSIFIER_CONFIDENCE_THRESHOLD: ${CLASSIFIER_CONFIDENCE_THRESHOLD:-0.39}
      BOLT_CLASSIFIER_THRESHOLD: ${BOLT_CLASSIFIER_THRESHOLD:-0.39}
      NUT_CLASSIFIER_THRESHOLD: ${NUT_CLASSIFIER_THRESHOLD:-0.51}
      CLASSIFIER_CROP_CONTEXTS: ${CLASSIFIER_CROP_CONTEXTS:-0.20}
      CLASSIFIER_IMAGE_SIZE: ${CLASSIFIER_IMAGE_SIZE:-224}
      MIN_BOX_AREA_RATIO: ${MIN_BOX_AREA_RATIO:-0.001}
      FINAL_NMS_IOU_THRESHOLD: ${FINAL_NMS_IOU_THRESHOLD:-0.45}
    volumes:
      - ./models:/app/models:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json, urllib.request;
          response = json.load(urllib.request.urlopen('http://127.0.0.1:8000/health'));
          raise SystemExit(0 if response.get('status') == 'ready' else 1)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
